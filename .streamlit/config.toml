# Streamlit 服务配置
[server]
headless = true
port = 8501
maxUploadSize = 50
# 地图脚本（ECharts / china.js）放在 src/static/pyecharts/，由 Streamlit
# 以相对路径 app/static/pyecharts/... 同源提供（Cloud 会自动加 /~/+/ 前缀），
# 避免外部 CDN 证书 / 网络故障导致地图空白。
enableStaticServing = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#4f6ef7"
backgroundColor = "#eef2fa"
secondaryBackgroundColor = "#f6f8ff"
textColor = "#0f172a"
font = "sans serif"
